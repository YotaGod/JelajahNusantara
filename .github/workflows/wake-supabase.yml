name: Wake Supabase

on:
  schedule:
    - cron: "0 6 * * *"   # Runs once per day at 06:00 UTC (13:00 WIB)
  workflow_dispatch:       # Allows manual runs from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SUPABASE_PROJECTS_JSON secret exists
        run: |
          if [ -z "${{ secrets.SUPABASE_PROJECTS_JSON }}" ]; then
            echo "❌ Secret SUPABASE_PROJECTS_JSON is not set."
            echo "Go to Settings > Secrets and variables > Actions and add it."
            exit 1
          fi

      - name: Perform Write Operations & Health Check
        env:
          SUPABASE_PROJECTS_JSON: ${{ secrets.SUPABASE_PROJECTS_JSON }}
        run: |
          # Install jq for JSON parsing
          sudo apt-get update -y > /dev/null
          sudo apt-get install -y jq > /dev/null

          LENGTH=$(echo "$SUPABASE_PROJECTS_JSON" | jq '. | length')
          echo "🔍 Found $LENGTH Supabase project(s) to ping."

          if [ "$LENGTH" -eq 0 ]; then
            echo "⚠️ No projects defined in SUPABASE_PROJECTS_JSON."
            exit 0
          fi

          for i in $(seq 0 $((LENGTH - 1))); do
            URL=$(echo "$SUPABASE_PROJECTS_JSON" | jq -r ".[$i].url")
            KEY=$(echo "$SUPABASE_PROJECTS_JSON" | jq -r ".[$i].anon_key")

            echo "--------------------------------------------------"
            echo "Processing project index $i..."

            if [ -z "$URL" ] || [ "$URL" = "null" ]; then
              echo "⚠️ Skipping project at index $i - missing url."
              continue
            fi

            if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
              echo "⚠️ Skipping $URL - missing anon_key."
              continue
            fi

            # 1. Perform Write (INSERT) Operation
            INSERT_URL="${URL%/}/rest/v1/log_activity"
            echo "📡 Performing database write (INSERT) via: $INSERT_URL"

            set +e
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"activity_name": "SYSTEM_WAKEUP", "deskripsi": "Automated ping to keep project alive"}' \
              "$INSERT_URL")
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -ne 0 ]; then
              echo "❌ Curl connection failed for database write on $URL (exit code $CURL_EXIT)."
            elif [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Database write (INSERT) successful: responded with HTTP $HTTP_CODE"
            elif [ "$HTTP_CODE" -eq 404 ]; then
              echo "⚠️ Database responded with HTTP 404. Table 'log_activity' might not exist, but the Database is ACTIVE!"
            else
              echo "❌ Database write (INSERT) failed: responded with HTTP $HTTP_CODE"
            fi

            # 2. Perform Cleanup (DELETE) Operation (Older than 7 days)
            SEVEN_DAYS_AGO=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
            DELETE_URL="${URL%/}/rest/v1/log_activity?activity_name=eq.SYSTEM_WAKEUP&timestamp=lt.${SEVEN_DAYS_AGO}"
            echo "📡 Performing database cleanup (DELETE logs older than 7 days) via: $DELETE_URL"

            set +e
            DEL_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              "$DELETE_URL")
            DEL_CURL_EXIT=$?
            set -e

            if [ "$DEL_CURL_EXIT" -ne 0 ]; then
              echo "❌ Curl connection failed for database cleanup on $URL (exit code $DEL_CURL_EXIT)."
            elif [ "$DEL_HTTP_CODE" -ge 200 ] && [ "$DEL_HTTP_CODE" -lt 300 ]; then
              echo "✅ Database cleanup (DELETE) successful: responded with HTTP $DEL_HTTP_CODE"
            elif [ "$DEL_HTTP_CODE" -eq 404 ]; then
              echo "⚠️ Database responded with HTTP 404 for DELETE operation (table 'log_activity' might not exist)."
            else
              echo "❌ Database cleanup (DELETE) failed: responded with HTTP $DEL_HTTP_CODE"
            fi

            # 3. Backup: Ping /auth/v1/health
            HEALTH_URL="${URL%/}/auth/v1/health"
            echo "📡 Performing backup health check via: $HEALTH_URL"

            set +e
            HEALTH_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $KEY" \
              "$HEALTH_URL")
            HEALTH_CURL_EXIT=$?
            set -e

            if [ "$HEALTH_CURL_EXIT" -ne 0 ]; then
              echo "❌ Backup health check curl failed for $URL (exit code $HEALTH_CURL_EXIT)."
            elif [ "$HEALTH_HTTP_CODE" -ge 200 ] && [ "$HEALTH_HTTP_CODE" -lt 300 ]; then
              echo "✅ Backup health check successful: responded with HTTP $HEALTH_HTTP_CODE"
            else
              echo "❌ Backup health check failed: responded with HTTP $HEALTH_HTTP_CODE"
            fi
          done
